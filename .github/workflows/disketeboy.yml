name: DisketeBoy
on:
  push:
    paths: ['disketeboy/**', '.github/workflows/disketeboy.yml']
  pull_request:
    paths: ['disketeboy/**', '.github/workflows/disketeboy.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Pruebas unitarias
        run: node --test disketeboy/tests/unit/*.test.mjs
      - name: Pruebas en navegador
        run: node disketeboy/tests/e2e/run.mjs
        env:
          E2E_SHOTS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disketeboy-capturas
          path: disketeboy/tests/e2e/out/
