name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:e2e
        env:
          E2E_SHOTS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-e2e
          path: tests/e2e/out/
